appId: dev.gganster.myterm
productName: MyTerm
copyright: MIT

# node-pty ships N-API prebuilds that load under both Node and Electron, so
# there is nothing to recompile (ADR-002, revised after measurement). Left on,
# electron-builder invokes @electron/rebuild, which tries to build the bundled
# legacy winpty and fails on machines without the Spectre-mitigated MSVC libs.
# Re-enable this if a genuinely non-N-API native dependency is ever added.
npmRebuild: false

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'

extraResources:
  # Both are copied to %LOCALAPPDATA%\MyTerm\bin by installer.nsh: the CLI shim,
  # and the PATH editor that the install and uninstall macros both invoke. The
  # second is run from that copy rather than from the install directory, because
  # the uninstaller needs it and the install directory is what it is removing.
  - from: resources/myterm.cmd
    to: myterm.cmd
  - from: resources/path-entry.ps1
    to: path-entry.ps1

# A .node binary cannot be loaded from inside an asar archive. Getting this
# wrong produces an app that runs perfectly in development and shows six empty
# panes once packaged (ARCHI § electron-builder).
asarUnpack:
  - '**/node_modules/node-pty/**'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # Per-user install: no UAC prompt, and uninstall leaves nothing machine-wide.
  perMachine: false
  # perMachine: false alone does NOT mean "no elevation". It leaves the install
  # mode page in place, and with allowElevation at its default the "Anyone who
  # uses this computer" option is live: choosing it relaunches the installer
  # elevated, so $INSTDIR moves to Program Files while installer.nsh keeps
  # writing to HKCU and %LOCALAPPDATA% — which are now the *administrator's*.
  # The user who asked for MyTerm would get no PATH entry and no context menu,
  # and an unrelated account would get both, pointing at Program Files.
  allowElevation: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: build/installer.nsh
  artifactName: ${productName}-${version}-setup.${ext}
  # Unsigned for now: SmartScreen will warn. See ARCHI § Cost Estimation and the
  # README; SignPath Foundation is the route for a signed open-source build.

# Ce bloc a deux rôles, et le second est facile à oublier : il désigne la cible
# du téléversement *et* il est la source de l'`app-update.yml` embarqué dans le
# paquet, c'est-à-dire le dépôt qu'interroge chaque app déjà installée. Déplacer
# le dépôt sans mettre ces champs à jour couperait les mises à jour du parc.
publish:
  provider: github
  owner: gganster
  repo: myterm
  # `draft`, et non `release` : la CI crée la release en brouillon, téléverse
  # l'installeur et latest.yml, puis la publie (étape « Promote » de
  # release.yml). Un brouillon est exclu de /releases/latest, donc invisible
  # pour electron-updater — personne ne peut tomber sur une release à moitié
  # téléversée. Et un run qui échoue en cours de route laisse un brouillon, que
  # le run suivant réutilise et complète au lieu de rester bloqué dessus.
  releaseType: draft
