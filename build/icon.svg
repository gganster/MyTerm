<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Logo MyTerm : la source de verite. icon.png et icon.ico en derivent, ne les
    retouchez pas a la main, regenerez-les (ImageMagick) :

      sed 's/width="512" height="512"/width="1024" height="1024"/' build/icon.svg > /tmp/i.svg
      magick -background none /tmp/i.svg png32:/tmp/i.png
      magick /tmp/i.png -resize 512x512 png32:build/icon.png
      for s in 16 32 48 64 128 256; do magick /tmp/i.png -filter Lanczos -resize ${s}x${s} -strip png32:/tmp/i-$s.png; done
      puis assembler /tmp/i-NN.png en .ico a entrees PNG (16 a 256), pas en BMP :
      un .ico BMP pese une vingtaine de fois plus lourd pour le meme rendu.

      (Pas d'accents ni de double tiret dans ce commentaire : XML les refuse, et
      un SVG illisible casse silencieusement la chaine ci-dessus.)

    Le pane actif, bleu (couleur accent du theme sombre), porte le prompt ; les
    deux panes voisins disent le multiplexeur. C'est la seule idee du logo, et
    elle doit survivre a 16 px : verifiez a cette taille avant de commiter.
  -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#16181d"/>
  <rect x="72" y="72" width="216" height="368" rx="28" fill="#4c8dff"/>
  <rect x="312" y="72" width="128" height="174" rx="24" fill="#2a2f3a"/>
  <rect x="312" y="266" width="128" height="174" rx="24" fill="#2a2f3a"/>
  <path d="M 122 212 L 166 256 L 122 300" fill="none" stroke="#16181d" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="190" y="286" width="58" height="28" rx="14" fill="#16181d"/>
</svg>
