name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a release be rehearsed without creating a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Windows-only by design: the MVP targets Windows 11 (PRD), and the NSIS
    # target cannot be produced elsewhere.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No native compilation happens here: node-pty ships N-API prebuilds and
      # npmRebuild is off (ADR-002). If that ever changes, this job will need
      # the MSVC Spectre-mitigated libraries installed.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and publish
        # A tag publishes; a manual run only builds the artifacts.
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: myterm-windows
          path: |
            release/*.exe
            release/latest.yml
